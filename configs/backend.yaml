default_backend: convlstm_online
fallback_backend: gaussian_fallback
state_store: in_memory
max_recent_observations: 500
auto_update_on_ingest: true
convlstm_sequence_length: 3
convlstm_input_channels: 10
convlstm_input_mode: degraded

use_model_registry: true
model_registry_path: artifacts/convlstm_ops/model_registry.json

convlstm_prediction_engine: torch_multistep
convlstm_checkpoint_path: artifacts/models/convlstm_multistep_autoreg_two_stage_v1/best_full_checkpoint.pt
convlstm_init_mode: checkpoint_required
convlstm_device: cuda
convlstm_checkpoint_strict: false
convlstm_forecast_horizon: 4
convlstm_output_mode: multiframe

convlstm_ridge_model_path: artifacts/models/ridge_plume_baseline.pkl
